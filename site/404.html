<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — antispam.bot</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0B0E14;
    --ink:#F2F6FA; --muted:#9FAAB6; --dim:#B9C2CE;
    --green:#06D6A0; --blue:#3B82F6;
    --line:rgba(255,255,255,.08);
    --grad:linear-gradient(100deg,#06D6A0,#3B82F6);
  }
  body{
    font-family:'Outfit',system-ui,-apple-system,sans-serif;
    color:var(--dim);
    background:
      radial-gradient(1200px 560px at 72% -12%,rgba(59,130,246,.16),transparent),
      radial-gradient(1000px 560px at 6% 108%,rgba(6,214,160,.1),transparent),
      var(--bg);
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    line-height:1.5;-webkit-font-smoothing:antialiased;padding:24px;
  }
  .card{text-align:center;max-width:520px}
  .mark{position:relative;width:56px;height:64px;margin:0 auto 28px}
  .mark>.m-out,.mark>.m-in{position:absolute;inset:0;clip-path:polygon(50% 0,100% 16%,100% 56%,50% 100%,0 56%,0 16%)}
  .mark>.m-out{background:var(--grad)}
  .mark>.m-in{background:var(--bg);inset:2px}
  .mark>.m-glyph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:22px;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .code{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--green);letter-spacing:.16em;text-transform:uppercase;margin-bottom:10px}
  h1{font-family:'Space Grotesk',sans-serif;font-size:clamp(56px,12vw,96px);font-weight:700;color:var(--ink);letter-spacing:-.02em;line-height:1;margin-bottom:14px}
  p{color:var(--muted);margin-bottom:28px}
  .btn{display:inline-block;padding:12px 26px;border-radius:10px;background:var(--grad);color:#06121C;font-weight:600;text-decoration:none;transition:opacity .15s}
  .btn:hover{opacity:.88}
  .foot{margin-top:36px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted)}
  .foot a{color:var(--blue);text-decoration:none}
  .foot a:hover{color:var(--green)}
</style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true"><div class="m-out"></div><div class="m-in"></div><div class="m-glyph">iG</div></div>
    <div class="code">error &middot; not found</div>
    <h1>404</h1>
    <p>This page doesn&rsquo;t exist. If it were spam, it would already be gone.</p>
    <a class="btn" href="/">Back to antispam.bot</a>
    <div class="foot"><a href="https://t.me/iLangGuardBot">@iLangGuardBot</a> &middot; <a href="https://github.com/ilang-ai/TelegramGuard">GitHub</a></div>
  </main>
</body>
</html>
